steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/Dockerfile.nginx
      - --build-arg
      - REGISTRY_BASE_URL=https://infra-vc-registry-web-911368042037.asia-east2.run.app
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed

substitutions:
  _REGION: asia-east2
  _AR_REPO: vc-registry
  _IMAGE: infra-vc-registry-web
  _SERVICE: infra-vc-registry-web

options:
  logging: CLOUD_LOGGING_ONLY
