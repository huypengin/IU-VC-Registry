user  nginx;
worker_processes  1;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;
    
      # Security headers (basic)
      server_tokens off;

    server {
        listen       80;
        server_name  _;

        # Serve files from the default nginx html directory
        root /usr/share/nginx/html;

        # Return index.html for directory roots
        location / {
            try_files $uri $uri/ =404;
            # add helpful headers
          add_header X-Content-Type-Options nosniff;
          add_header X-Frame-Options DENY;
          add_header Referrer-Policy no-referrer;
        }
        
         # Explicitly serve JSON-LD as application/ld+json
        types {
          application/ld+json jsonld;
          application/json json;
        }

        location /status/ {
            default_type application/ld+json;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=300, must-revalidate";
            add_header X-Content-Type-Options nosniff;
        }

        location ~* \.(json|jsonld)$ {
            default_type application/ld+json;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600, immutable";
            add_header X-Content-Type-Options nosniff;
        }

        # Fallback for well-known (e.g. /.well-known/did.json)
        location /.well-known/ {
            try_files $uri =404;
        }

        # deny access to hidden files
        location ~ /\. {
            deny all;
        }
        
        # Healthz endpoint, useful for orchestrators
        location = /health {
          return 200 '{"status":"ok"}';
          add_header Content-Type application/json;
        }
        
        # logging (default)
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
    }
}

