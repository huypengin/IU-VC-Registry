
services:
  # Nginx web server (serves static files only)
  vc-registry-web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.nginx
      args:
        REGISTRY_BASE_URL: https://infra-vc-registry-web-911368042037.asia-east2.run.app
    container_name: iu-did-web-static
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
